# MyST configuration for the repro-em companion site.
# See: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: repro-em
  title: repro-EM
  description: >
    Companion site for "Open Formats, Standard Metadata, and Benchmarks:
    A Reproducibility Framework for Materials Electron Microscopy".
  keywords:
    - electron microscopy
    - reproducibility
    - open data formats
    - metadata standards
    - benchmarks
    - provenance
  github: https://github.com/ophusgroup/repro-em
  license:
    content: CC-BY-4.0
    code: CC-BY-4.0
  # Rendered as <abbr> with a hover definition wherever the term appears.
  # Matching is exact and case-sensitive, so spelling variants need their
  # own key (see 4DSTEM / 4D-STEM).
  abbreviations:
    # --- instruments and modes ---
    TEM: transmission electron microscopy
    STEM: scanning transmission electron microscopy
    SEM: scanning electron microscopy
    HRTEM: high-resolution transmission electron microscopy
    HRSTEM: high-resolution scanning transmission electron microscopy
    EFTEM: energy-filtered transmission electron microscopy
    4DSTEM: four-dimensional scanning transmission electron microscopy
    4D-STEM: four-dimensional scanning transmission electron microscopy
    FIB: focused ion beam
    FEG: field emission gun
    # --- imaging and detectors ---
    BF: bright field
    DF: dark field
    ADF: annular dark field
    HAADF: high-angle annular dark field
    ABF: annular bright field
    DPC: differential phase contrast
    iDPC: integrated differential phase contrast
    CTF: contrast transfer function
    PSF: point spread function
    MTF: modulation transfer function
    DQE: detective quantum efficiency
    SNR: signal-to-noise ratio
    DED: direct electron detector
    EMPAD: electron microscope pixel array detector
    # --- diffraction ---
    DP: diffraction pattern
    SAD: selected area diffraction
    SAED: selected area electron diffraction
    CBED: convergent beam electron diffraction
    PACBED: position-averaged convergent beam electron diffraction
    NBED: nanobeam electron diffraction
    PED: precession electron diffraction
    # --- spectroscopy and signals ---
    EELS: electron energy-loss spectroscopy
    XEDS: X-ray energy-dispersive spectroscopy
    EDS: energy-dispersive X-ray spectroscopy
    EDX: energy-dispersive X-ray spectroscopy
    CL: cathodoluminescence
    EBIC: electron beam induced current
    EBSD: electron backscatter diffraction
    # --- biological EM ---
    SPA: single-particle analysis
    cryo-EM: cryogenic electron microscopy
    cryo-ET: cryogenic electron tomography
    PDB: Protein Data Bank
    EMDB: Electron Microscopy Data Bank
    EMPIAR: Electron Microscopy Public Image Archive
    # --- data and reproducibility ---
    FAIR: findable, accessible, interoperable, reusable
    HDF5: Hierarchical Data Format version 5
    DOI: digital object identifier
    API: application programming interface
  exclude:
    - README.md
    - LICENSE
  toc:
    - file: index.md
    - file: manifesto.md
    - file: landscape.md
      children:
        - file: landscape/academia.md
        - file: landscape/industry.md
        - file: landscape/vendors.md
    - file: bio-tem.md
      children:
        - file: bio-tem/spa-cryo-em.md
        - file: bio-tem/cryo-tomography.md
    - file: materials-tem.md
      children:
        - file: materials-tem/methods.md
        - file: materials-tem/samples.md
        - file: materials-tem/simulations.md
    - file: framework.md
      children:
        - file: framework/detectors.md
        - file: framework/data.md
        - file: framework/metadata.md
        - file: framework/formats.md
        - file: framework/reconstruction.md
        - file: framework/analysis.md
        - file: framework/plotting.md
        - file: framework/benchmarks.md
        - file: framework/sharing.md
        - file: framework/publishing.md
        - file: framework/chain-of-custody.md
    - file: objections.md
    - file: calls-to-action.md
      children:
        - file: calls-to-action/academia.md
        - file: calls-to-action/industry.md
        - file: calls-to-action/vendors.md
        - file: calls-to-action/funding-agencies.md
        - file: calls-to-action/journals-publishers.md
    - file: acknowledgements.md
site:
  template: book-theme
  title: repro-EM
  options:
    # Custom theming — see ./style.css
    style: ./style.css
    logo_text: repro-EM
    folders: true
    outline_maxdepth: 2
    hide_footer_links: true
  nav:
    - title: FAIR Data
      url: https://www.go-fair.org/fair-principles/
    - title: COLab
      url: https://colab.stanford.edu/
    - title: quantEM
      url: https://electronmicroscopy.github.io/quantem-docs/
